<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>REALM — Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="holders.css">
<link rel="stylesheet" href="mint.css">
</head>
<body class="holders mintpage">
<main class="h-page">
  <section class="h-card">
    <h2>Update the collection description</h2>
    <p class="h-note">Points the REALM collection at the corrected description. Only the owner wallet
      <b>BC5CV6iv…C45M2</b> can do this. Cost: about 0.000005 SOL.</p>
    <p class="h-note">Now: <span data-now>reading…</span></p>
    <p class="h-note">New: <a data-new target="_blank" rel="noopener">EvP4aUjn…</a></p>
    <button class="m-go" type="button" data-go>Connect &amp; approve</button>
    <a class="m-go" data-phantom hidden>Open in Phantom</a>
    <p class="h-note" data-out></p>
  </section>
</main>
<script src="mint-chain.js"></script>
<script>
(() => {
  const COLLECTION = "DyzuV3bcNthHcYVrVZbrJzJG64FpMT3jUAQyyyw3xAa1";
  const OWNER = "BC5CV6ivBkWW2wL5YMsZovoYXBreM8mgdfL2cSjC45M2";
  const NEW = "https://gateway.irys.xyz/EvP4aUjnVjCkNULBDE2bBcwRFRdohzEinxDKTFFBVmRC";
  const $ = s => document.querySelector(s), out = m => $("[data-out]").innerHTML = m;
  $("[data-new]").href = NEW;
  RealmMint.init({ rpc: location.origin + "/api/rpc", machine: "5qG2B6RssAkpsg3KLJTbgLTbQUc6B6HBroPDh8UoCbd7" })
    .then(() => RealmMint.collectionUri(COLLECTION))
    .then(c => { $("[data-now]").textContent = c.uri === NEW ? "already updated ✓" : c.uri; if (c.uri === NEW) $("[data-go]").hidden = true; });
  if (!RealmMint.hasWallet()) {
    $("[data-go]").hidden = true;
    const a = $("[data-phantom]"); a.hidden = false;
    a.href = "https://phantom.app/ul/browse/" + encodeURIComponent(location.href) + "?ref=" + encodeURIComponent(location.origin);
  }
  $("[data-go]").addEventListener("click", async () => {
    try {
      const me = await RealmMint.connect();
      if (me !== OWNER) return out("This wallet is " + me.slice(0, 4) + "…" + me.slice(-4) + ". Switch Phantom to BC5CV6iv…C45M2 and try again.");
      out("Approve in Phantom…");
      const sig = await RealmMint.setCollectionUri(COLLECTION, NEW);
      out('Done ✓ <a target="_blank" rel="noopener" href="https://solscan.io/tx/' + sig + '">view on Solscan</a>');
      $("[data-now]").textContent = "updated ✓"; $("[data-go]").hidden = true;
    } catch (e) { out("Did not go through: " + ((e && e.message) || "").slice(0, 140)); }
  });
})();
</script>
</body>
</html>
