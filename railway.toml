# Railway deploys this repo when main moves.
# Connect the service to 0xDrekz/realm-site, branch main,
# with auto-deploy on. Every push after that rebuilds and restarts.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
